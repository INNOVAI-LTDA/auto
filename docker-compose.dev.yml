services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
      POSTGRES_DB: auto
    ports:
      - "5432:5432"
    volumes:
      - auto_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  auto_postgres_data:
